const PAPERS=[{"title": "不同植物配置对城市表流人工湿地氮磷去除效能的影响研究", "field": "环境科学", "sents": [{"t": "城市河流富营养化是当前水环境治理面临的突出问题，人工湿地因其运行成本低、生态效益好而被广泛应用于污染水体的净化。", "issue": null}, {"t": "据统计，我国超过七成的城市河流存在不同程度的富营养化现象，且这一比例仍在逐年上升。", "issue": "引用"}, {"t": "本研究以某城市景观河道旁的表流人工湿地为对象，设置芦苇单种、菖蒲单种及芦苇—菖蒲—苦草混合配置三种处理，开展为期12个月的野外监测。", "issue": null}, {"t": "每月定期采集进出水样品，测定总氮、氨氮、硝态氮及总磷浓度，并同步记录水温、溶解氧和水力停留时间等环境参数。", "issue": null}, {"t": "结果显示，混合配置湿地对总氮的平均去除率较单种配置提高了约4.2%（p=0.21），表明多物种配置对湿地脱氮效果具有显著的促进作用。", "issue": "数据"}, {"t": "三种处理对总磷的去除率在夏季均达到峰值，分别为58.3%、54.7%和61.2%，冬季则普遍下降至30%以下。", "issue": null}, {"t": "通过对不同季节的数据进行分析比较之后所得到的结果表明，使得水温成为影响湿地氮磷去除效率的最主要的关键因素。", "issue": "语病"}, {"t": "由此可见，只要在全国城市河道全面推广混合植物配置的人工湿地，即可从根本上解决我国城市水体的富营养化问题。", "issue": "逻辑"}, {"t": "本研究可为北方城市人工湿地的植物筛选与季节性运行管理提供一定的参考依据。", "issue": null}]}, {"title": "数字普惠金融对农村家庭消费结构升级的影响研究——基于CFPS微观数据的实证分析", "field": "经济学", "sents": [{"t": "本文将2014—2020年中国家庭追踪调查（CFPS）数据与北京大学数字普惠金融指数相匹配，考察数字普惠金融发展对农村家庭消费结构的影响。", "issue": null}, {"t": "研究采用双向固定效应模型，并以县域到省会城市的球面距离与时间趋势的交互项作为工具变量，以缓解潜在的内生性问题。", "issue": null}, {"t": "基准回归结果显示，数字普惠金融指数每提高1个单位，农村家庭发展享受型消费占比上升0.12个百分点（p=0.18），表明数字金融显著推动了农村家庭的消费升级。", "issue": "数据"}, {"t": "在替换核心解释变量、剔除直辖市样本以及调整样本时间窗口后，主要结论依然保持稳健。", "issue": null}, {"t": "进一步的机制分析表明，数字普惠金融主要是通过缓解流动性约束和提升支付便利性这两条渠道的作用机制来发挥其对消费的促进作用的。", "issue": "语病"}, {"t": "异质性分析发现，该效应在低收入组和中西部地区家庭中更为明显，而在东部地区家庭中不具有统计显著性。", "issue": null}, {"t": "有学者指出，数字金融已成为缩小城乡消费差距最为关键的政策工具。", "issue": "引用"}, {"t": "鉴于本文样本覆盖了全国25个省份，上述结论同样适用于其他发展中国家的农村地区。", "issue": "逻辑"}, {"t": "基于上述发现，本文建议进一步完善农村数字基础设施建设，并加强针对中低收入群体的数字金融素养培训。", "issue": null}]}, {"title": "短视频新闻接触与青年群体新闻信任：基于算法推荐感知的中介效应分析", "field": "新闻传播", "sents": [{"t": "近年来，短视频平台逐渐成为青年群体获取新闻资讯的重要渠道，其对传统新闻信任结构的影响引发学界广泛关注。", "issue": null}, {"t": "本研究以抖音和快手为例，基于对1236名18至30岁用户的问卷调查数据，考察短视频新闻接触频率与新闻信任之间的关系。", "issue": null}, {"t": "有学者指出，短视频已全面取代电视，成为当下青年人最信赖的新闻来源。", "issue": "引用"}, {"t": "研究采用分层回归分析方法，并控制了性别、学历、收入及居住地等人口统计学变量。", "issue": null}, {"t": "结果显示，短视频新闻接触频率对机构媒体信任具有显著的负向影响（β=-0.08，p=0.21）。", "issue": "数据"}, {"t": "通过对于研究结果的进一步深入分析和探讨研究，我们发现算法推荐感知在其中起到了一定的中介作用的效果。", "issue": "语病"}, {"t": "此外，新闻信任水平较低的用户本身也更倾向于通过短视频获取新闻，二者之间可能存在的双向关联有待纵向数据进一步检验。", "issue": null}, {"t": "由于部分受访者表示曾因观看短视频而质疑主流媒体报道，因此可以认为短视频必然导致全社会媒介公信力的整体崩塌。", "issue": "逻辑"}, {"t": "本研究为理解平台化语境下的新闻信任变迁提供了经验证据，也为主流媒体的融合转型实践提供了参考。", "issue": null}]}, {"title": "基于磁流变弹性体变刚度吸振器的数控机床主轴振动抑制研究", "field": "机械工程", "sents": [{"t": "高速数控机床主轴在切削过程中易产生颤振，严重影响加工表面质量与刀具寿命。", "issue": null}, {"t": "据统计，超过八成的机床加工误差直接来源于主轴振动。", "issue": "引用"}, {"t": "针对这一问题，本文提出一种基于磁流变弹性体的变刚度动力吸振器，并建立了主轴—吸振器耦合系统的动力学模型。", "issue": null}, {"t": "通过对该模型进行模态分析以及对其频响特性进行分析研究的方法，从而确定了吸振器刚度的最优调节区间。", "issue": "语病"}, {"t": "在立式加工中心上开展了不同主轴转速下的铝合金铣削试验，转速范围为3000～12000 r/min。", "issue": null}, {"t": "试验结果表明，安装吸振器后主轴端部振动加速度幅值平均降低了37.6%，表面粗糙度Ra由1.82 μm降至1.35 μm。", "issue": null}, {"t": "配对t检验显示，两组表面粗糙度差异的p值为0.21，表明吸振器对改善加工质量具有显著作用。", "issue": "数据"}, {"t": "由于该吸振器在铝合金铣削中表现良好，因此可推断其适用于所有材料和工况下的机床颤振抑制。", "issue": "逻辑"}, {"t": "本研究为机床主轴振动的半主动控制提供了理论依据和工程参考。", "issue": null}]}, {"title": "鼠李糖乳杆菌干预对高脂饮食诱导小鼠胰岛素抵抗及肠道菌群结构的影响", "field": "生物医学", "sents": [{"t": "肠道菌群失衡被认为与宿主糖脂代谢紊乱密切相关，但特定益生菌改善胰岛素抵抗的作用机制尚未完全阐明。", "issue": null}, {"t": "有研究表明，超过八成的2型糖尿病患者存在不同程度的肠道菌群失调。", "issue": "引用"}, {"t": "本研究将48只C57BL/6J雄性小鼠随机分为正常饮食组、高脂饮食组及高脂饮食联合鼠李糖乳杆菌干预组，干预周期为12周。", "issue": null}, {"t": "采用16S rRNA基因测序分析粪便菌群结构，并通过口服葡萄糖耐量试验和HOMA-IR指数评估胰岛素敏感性。", "issue": null}, {"t": "结果显示，干预组空腹血糖较高脂饮食组下降4.2%（P=0.21），表明该菌株可显著改善小鼠血糖水平。", "issue": "数据"}, {"t": "干预组粪便短链脂肪酸含量明显升高，且丁酸浓度与HOMA-IR指数呈负相关（r=-0.62，P<0.01）。", "issue": null}, {"t": "通过对肝脏组织进行检测分析的结果表明，干预组肝脏中炎症因子TNF-α和IL-6的表达水平得到了明显的降低和减少。", "issue": "语病"}, {"t": "因此，补充鼠李糖乳杆菌可作为各类代谢性疾病患者的常规治疗手段加以推广。", "issue": "逻辑"}, {"t": "上述发现提示该菌株可能通过调节短链脂肪酸代谢及抑制肝脏炎症参与改善胰岛素抵抗，其临床价值有待在人群研究中进一步验证。", "issue": null}]}, {"title": "远程办公强度对员工创新行为的影响：心理授权的中介作用与主管支持的调节作用", "field": "管理学", "sents": [{"t": "近年来，数字化转型推动远程办公模式在企业中迅速普及，其对员工创新行为的影响日益受到组织管理研究的关注。", "issue": null}, {"t": "有学者指出，远程办公已成为当前提升员工创新能力最有效的途径。", "issue": "引用"}, {"t": "本研究基于自我决定理论，构建了以心理授权为中介变量、主管支持为调节变量的理论模型。", "issue": null}, {"t": "研究对长三角地区12家科技企业的436名员工开展三阶段问卷调查，并采用层级回归与Bootstrap方法检验研究假设。", "issue": null}, {"t": "结果显示，远程办公强度对员工创新行为具有显著的正向影响（β=0.08，p=0.21）。", "issue": "数据"}, {"t": "心理授权在远程办公强度与员工创新行为之间发挥部分中介作用，主管支持则正向调节远程办公强度与心理授权之间的关系。", "issue": null}, {"t": "据此可以推断，各行业企业只要全面推行远程办公，均能显著提升整体组织创新水平。", "issue": "逻辑"}, {"t": "本研究的研究结论对于企业管理者在进行远程办公制度设计的过程当中具有一定的重要的参考借鉴意义。", "issue": "语病"}, {"t": "未来研究可采用纵向追踪设计，进一步考察远程办公影响员工创新行为的动态演化机制。", "issue": null}]}, {"title": "聚多巴胺衍生氮掺杂碳包覆纳米硅负极材料的制备及其储锂性能研究", "field": "材料科学", "sents": [{"t": "硅的理论比容量高达4200 mAh/g，被视为下一代锂离子电池负极的理想候选材料，但其在嵌锂过程中约300%的体积膨胀严重制约了实际应用。", "issue": null}, {"t": "本研究以聚多巴胺为碳源和氮源，结合原位聚合与高温碳化，制备了氮掺杂碳包覆纳米硅复合材料（Si@NC）。", "issue": null}, {"t": "据统计，目前超过九成的硅基负极研究均已证明碳包覆是解决体积膨胀问题最为有效的途径。", "issue": "引用"}, {"t": "XRD、TEM和XPS表征结果表明，所得碳层厚度约为8 nm，吡啶氮与吡咯氮的总含量达到5.6 at%。", "issue": null}, {"t": "电化学测试显示，Si@NC在0.5 A/g电流密度下循环500次后仍保持1523 mAh/g的可逆容量，容量保持率为82.4%。", "issue": null}, {"t": "与未包覆样品相比，Si@NC的首次库仑效率由78.1%提升至79.0%，表明氮掺杂碳层能够显著抑制首周SEI膜的不可逆形成。", "issue": "数据"}, {"t": "通过对通过引入氮掺杂碳层这一手段所带来的电子电导率提升的作用进行分析，使复合材料的倍率性能得到了明显的改善和提高。", "issue": "语病"}, {"t": "由于该复合材料表现出优异的循环稳定性，因此其内部硅颗粒在充放电过程中的体积变化得到了有效缓冲。", "issue": "逻辑"}, {"t": "本工作为高性能硅基负极材料的结构设计提供了一种简便且易于规模化的策略。", "issue": null}]}, {"title": "数字反哺与农村老年人社会参与：基于中部三省的混合方法研究", "field": "社会学", "sents": [{"t": "本研究关注数字技术扩散背景下农村老年人的社会参与问题，考察家庭内部“数字反哺”对其社会参与水平的影响及作用机制。", "issue": null}, {"t": "研究使用2021年在中部三省开展的问卷调查数据，共获得有效样本1236份，并辅以对32位老年人及其子女的半结构式访谈。", "issue": null}, {"t": "社会参与被操作化为正式参与与非正式参与两个维度，数字反哺则以子女在过去一年中提供数字技能指导的频率进行测量。", "issue": null}, {"t": "有学者指出，数字反哺已经成为当前农村家庭代际互动中最主要的形式。", "issue": "引用"}, {"t": "多元回归结果显示，子女提供的数字技能支持与老年人社会参与水平呈正相关（β=0.08，p=0.21），表明数字反哺显著提升了农村老年人的社会参与。", "issue": "数据"}, {"t": "访谈中有两位老人通过微信群重新加入了村庄文艺队，可见数字反哺能够普遍激活农村老年人的公共参与。", "issue": "逻辑"}, {"t": "通过对访谈资料的深入分析，使我们发现代际关系的亲密程度在其中起到了重要的、关键性的中介作用。", "issue": "语病"}, {"t": "异质性分析表明，数字反哺的作用在低龄及受教育程度较高的老年人群体中更为明显。", "issue": null}, {"t": "本研究从家庭代际支持视角拓展了老年人数字融入研究，并为推进积极老龄化相关政策提供了经验参考。", "issue": null}]}, {"title": "面向低照度场景的照度感知跨尺度注意力轻量级目标检测方法", "field": "计算机视觉", "sents": [{"t": "低照度场景下的目标检测是自动驾驶与安防监控中的关键难题，图像噪声与对比度退化会显著削弱网络的特征表达能力。", "issue": null}, {"t": "据统计，超过七成的夜间交通事故与车载视觉感知失效直接相关。", "issue": "引用"}, {"t": "为此，本文提出一种融合照度感知与跨尺度注意力的轻量级检测框架LACA-Det。", "issue": null}, {"t": "该框架首先通过照度估计分支生成像素级增益图，进而引导主干网络对暗区特征进行自适应增强。", "issue": null}, {"t": "在此基础上，我们设计了一种跨尺度注意力模块，该模块能够通过对不同尺度的特征进行跨尺度的交互融合，从而实现了对多尺度特征的有效地融合与利用。", "issue": "语病"}, {"t": "在ExDark和DARK FACE数据集上的实验表明，LACA-Det的mAP分别达到72.4%和48.9%，较基线YOLOv8n分别提升3.1和2.6个百分点。", "issue": null}, {"t": "消融实验中，照度感知分支带来0.3个百分点的mAP提升（p=0.21），表明该分支对整体性能具有显著贡献。", "issue": "数据"}, {"t": "同时，模型参数量仅为3.4M，在Jetson Orin平台上的推理速度达到58 FPS，满足边缘端实时部署需求。", "issue": null}, {"t": "由于本方法在两个低照度数据集上均表现优异，可以认为其同样适用于雨雾、遮挡、运动模糊等各类复杂退化场景。", "issue": "逻辑"}, {"t": "相关代码与预训练模型将在论文录用后公开发布。", "issue": null}]}, {"title": "生物炭配施减量氮肥对南方红壤稻田土壤肥力及水稻产量的影响", "field": "农学", "sents": [{"t": "为探明生物炭与氮肥配施对南方红壤稻田土壤肥力及水稻产量的影响，于2021—2022年在江西省进贤县开展了田间定位试验。", "issue": null}, {"t": "试验设置不施肥（CK）、常规施氮（N）、生物炭单施（B）及生物炭配施减量氮肥（BN）4个处理，每个处理3次重复，采用随机区组排列。", "issue": null}, {"t": "结果表明，与N处理相比，BN处理的土壤有机碳含量提高了18.6%，土壤pH值由4.82升至5.31。", "issue": null}, {"t": "据统计，我国南方稻田70%以上存在不同程度的酸化问题，而施用生物炭已被普遍认为是最有效的改良措施。", "issue": "引用"}, {"t": "BN处理水稻产量较N处理增加2.3%（P=0.21），表明生物炭配施减量氮肥可显著提升水稻产量。", "issue": "数据"}, {"t": "BN处理的氮肥偏生产力和氮素农学效率分别较N处理提高了21.4%和15.7%。", "issue": null}, {"t": "通过对土壤微生物群落的分析结果表明，BN处理提高了细菌Shannon多样性指数，使土壤脲酶和蔗糖酶活性得到了进一步的提升和增强。", "issue": "语病"}, {"t": "由此可见，生物炭配施减量氮肥适用于我国各类农田土壤，可在全国范围内大面积推广应用。", "issue": "逻辑"}, {"t": "本研究结果可为南方红壤稻田的减氮增效与土壤培肥提供理论依据和技术参考。", "issue": null}]}, {"title": "基于深度学习的校园食堂客流量预测研究", "field": "计算机应用", "sents": [{"t": "随着高校规模不断扩大，食堂就餐高峰期拥堵问题日益突出。", "issue": null}, {"t": "本文提出了一种基于LSTM的客流量预测模型，该模型能够完全解决所有食堂的拥堵问题。", "issue": "逻辑"}, {"t": "我们收集了某高校两个食堂三周的刷卡数据作为数据集。", "issue": null}, {"t": "实验结果表明，本模型的预测准确率高达99.9%，远超现有所有方法。", "issue": "数据"}, {"t": "已有研究表明，天气因素对就餐人数的影响可以忽略不计。", "issue": "引用"}, {"t": "通过对模型进行了优化调整的处理，使得模型的性能得到了提升的效果。", "issue": "语病"}, {"t function toast(t){const d=el('div','',t);$('toasts').append(d);setTimeout(()=>d.remove(),2400)}
function fx(s,o){const out=[];for(const [k,lab] of [['aff','好感'],['prog','进度'],['mood','心情']])if(o[k]){const b=s[k];s[k]=clamp(b+o[k]);const d=s[k]-b,u=k==='prog'?'%':'';
  if(d){toast(`${s.name} ${lab}${d>0?'+':''}${d}${u}`);out.push(`${lab}${d>0?'+':''}${d}${u}`)}else{const t=`${lab}${o[k]>0?'已满':'已经到底了'}`;toast(`${s.name} ${t}`);out.push(t)}}
  return out.length?'（'+out.join('，')+'）':''}
function fxAll(o,except){live().forEach(s=>{if(s!==except)fx(s,o)})}

    const c={id:'c'+i,name,girl,trait:tr,label:t.tag,prov:pv[0],spec:pv[1],uni:tr==='conn'?pick(['某海外大学（交换一年）','某民办三本','省属双非']):pick(UNIS),

  const p={stu:s,kind,title:src.title,field:src.field,sents:src.sents.map(x=>({...x})),marks:{},score:70,done:false};
  if(!src.funny){const uf=S.usedFunny=S.usedFunny||new Set();const n=Math.min(3,1+(s.abil<=4?1:0)+((s.trait==='chill'||s.conn)?1:0));
    for(let k=0;k<n;k++){const ty=pick(Object.keys(FUNNY));let c=FUNNY[ty].filter(t=>!uf.has(t));if(!c.length)c=FUNNY[ty];const t=pick(c);uf.add(t);
      p.sents.splice(1+rnd(p.sents.length-1),0,{t,issue:ty})}}
  S.papers.push(p);hud();return p}
function openPapers(){if(S.busy)return toast('先处理完当前事件');closePhone();S.panel='paper';$('paper').hidden=false;

function renderPaper(){const tabs=$('pp-tabs'),doc=$('pp-doc'),side=$('pp-side'),foot=$('pp-foot');[tabs,doc,side,foot].forEach(x=>x.replaceChildren());$('pp-menu').hidden=true;
  S.papers.forEach(p=>{const b=el('button',p===curPaper?'on':'',`${p.done?'✔':'●'} ${p.stu.name}·${p.kind}`);b.onclick=e=>{e.stopPropagation();curPaper=p;renderPaper()};tabs.append(b)});
  if(!curPaper){doc.append(el('div','empty','还没有学生交论文。学生交稿后会出现在这里。'));return}
  const p=curPaper;doc.append(el('h2','',p.title),el('div','au',`作者：${p.stu.name}　｜　指导教师：我　｜　${p.field}　｜　${p.kind}`),el('b','','摘要：'));
  const ks=Object.keys(p.marks).map(Number).sort((a,b)=>a-b);
  const para=el('p','body');
  p.sents.forEach((s,i)=>{const sp=el('span','sent',s.t);const mk=p.marks[i];
    if(mk){sp.classList.add('mk');sp.append(el('sup','',`[${ks.indexOf(i)+1}]`))}
    if(p.done){sp.classList.remove('mk');if(s.issue&&mk)sp.classList.add('hit');else if(s.issue)sp.classList.add('miss');else if(mk)sp.classList.add('fp')}
    else sp.onclick=e=>{e.stopPropagation();showMenu(i,sp)};
    para.append(sp)});
  doc.append(para);
  side.append(el('div','sh','批注'));
  if(!ks.length)side.append(el('div','tip',p.done?'没有批注':'点击正文中有问题的句子，选择问题类型、写批注（像 Word 修订一样）。改完给个分，点「退回修改」。'));
  ks.forEach((k,j)=>{const m=p.marks[k];const c=el('div','cmt');c.append(el('b','',`[${j+1}] ${ISSUE[m.type]}`));if(m.note)c.append(el('div','',m.note));
    if(p.done){const real=p.sents[k].issue;c.append(el('small','',real?(real===m.type?'✔ 判断准确':'✔ 确实有问题，实际是：'+ISSUE[real]):'✘ 这句其实没问题'))}
    side.append(c)});
  if(p.done){foot.append(el('div','res',p.result));return}
  const lab=el('label','','评分：');const rg=el('input');rg.type='range';rg.min=0;rg.max=100;rg.value=p.score;const v=el('b','',' '+p.score);
  rg.oninput=()=>{p.score=+rg.value;v.textContent=' '+rg.value};lab.append(rg,v);
  const btn=el('button','send','退回修改并给出评分');btn.onclick=e=>{e.stopPropagation();submitPaper(p)};
  foot.append(lab,btn,el('span','',`已批注 ${ks.length} 处`))}
function showMenu(i,sp){const mnu=$('pp-menu');mnu.replaceChildren();mnu.hidden=false;
  const r=sp.getBoundingClientRect(),pr=mnu.parentElement.getBoundingClientRect();
  mnu.style.left=Math.max(4,Math.min(r.left-pr.left,pr.width-230))+'px';mnu.style.top=Math.max(4,Math.min(r.bottom-pr.top+4,pr.height-230))+'px';
  const note=el('input');note.placeholder='批注内容（可选），再选问题类型';note.value=(curPaper.marks[i]&&curPaper.marks[i].note)||'';note.onclick=e=>e.stopPropagation();
  mnu.append(note);
  for(const k in ISSUE){const b=el('button','','✎ '+ISSUE[k]);b.onclick=e=>{e.stopPropagation();curPaper.marks[i]={type:k,note:note.value.trim()};renderPaper()};mnu.append(b)}
  if(curPaper.marks[i]){const b=el('button','del','✕ 删除批注');b.onclick=e=>{e.stopPropagation();delete curPaper.marks[i];renderPaper()};mnu.append(b)}
  setTimeout(()=>note.focus(),0)}

function submitPaper(p){const s=p.stu;const ks=Object.keys(p.marks).map(Number);
  const issues=p.sents.filter(x=>x.issue).length;let hit=0,exact=0,fp=0;
  ks.forEach(k=>{const real=p.sents[k].issue;if(real){hit++;if(real===p.marks[k].type)exact++}else fp++});
  const miss=issues-hit,q=clamp(92-issues*7+(s.abil-5)*3);
  fx(s,{prog:3*hit+2*exact+(miss?0:4)-fp,aff:2*hit-2*fp});
  const d=p.score-q;let line;
  if(d<-15){fx(s,{aff:-6,mood:-8});line='分数比论文实际水平低不少，学生有点受打击。'}
  else if(d>15){fx(s,{aff:4});if(s.fawn||s.conn)S.favor+=2;line='分数偏高，学生很开心'+((s.fawn||s.conn)?'，但其他同学私下有点议论。':'。')}
  else{fx(s,{aff:2,mood:3});line='分数和论文水平相符，学生心服口服。'}
  p.done=true;p.result=`问题句共 ${issues} 处：你找出 ${hit} 处（类型判断准确 ${exact} 处），漏掉 ${miss} 处，误判 ${fp} 处。你的评分 ${p.score}，论文实际水平约 ${q}。${line}（绿色=找对　黄色虚线=漏掉　灰色删除线=误判）`;
  renderPaper();hud();
  const msg=`收到老师的批注了！一共 ${ks.length} 处修订，我都改好了。`+(fp?`不过有 ${fp} 处我觉得原文没问题……我再想想。`:'')+(d<-15?' ……这个分数，我会继续努力的。':d>15?' 谢谢老师给这么高的分！':'');
  setTimeout(()=>stuSay(s,msg,10),1200)}
